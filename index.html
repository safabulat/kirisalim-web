<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ev arkadaşlarıyla ortak giderler, faturalar ve ay sonu hesabı.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kırışalım">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kırışalım</title>
  <meta name="theme-color" content="#0F766E">
  <meta name="darkreader-lock">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="https://cdn.jsdelivr.net/gh/safabulat/kirisalim-site@86eb0936711b0950a7535545a55114da65f320f1/app/main.dart.js" as="script">
</head>
<body>
  <!-- Açılış: Flutter'ın çizim motoru inerken boş beyaz sayfa yerine bu görünür; ilk karede kalkar. -->
  <style>
    :root { --bg: #F5F7F6; --fg: #14201E; --muted: #5B6B68; --track: #DCE5E3; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1413; --fg: #E6EEEC; --muted: #9AACA8; --track: #22302D; } }
    :root[data-theme="dark"] { --bg: #0E1413; --fg: #E6EEEC; --muted: #9AACA8; --track: #22302D; }
    html, body { margin: 0; background: var(--bg); }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--fg);
      transition: opacity .25s ease; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 8px 28px rgba(15,118,110,.25); }
    #splash h1 { margin: 6px 0 0; font-size: 26px; font-weight: 800; letter-spacing: -.3px; }
    #splash p { margin: 0; color: var(--muted); font-size: 14px; }
    #splash .bar { width: 160px; height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 10px; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #0F766E;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #splash.gone { opacity: 0; pointer-events: none; }
  </style>
  <script>
    // Uygulamada seçilen tema (shared_preferences web'de localStorage'a "flutter.theme_mode" diye yazar).
    try {
      var m = JSON.parse(localStorage.getItem('flutter.theme_mode') || 'null');
      if (m === 'dark' || m === 'light') document.documentElement.setAttribute('data-theme', m);
    } catch (e) {}
  </script>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <h1>Kırışalım</h1>
    <p>Ev hesabı açılıyor…</p>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
